name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux packages (AppImage + .deb)
    runs-on: ubuntu-24.04
    env:
      # appimagetool je i sam AppImage — bez FUSE ga pokrećemo izdvojeno
      APPIMAGE_EXTRACT_AND_RUN: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: System libraries (Qt runtime)
        run: |
          sudo apt-get update
          # libmpv se NE instalira: PyInstaller bi ga uvukao u bundle, a libmpv
          # sa Ubuntu se ne može učitati na drugoj distribuciji.
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libxcb-cursor0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build PyInstaller binary
        run: python -m PyInstaller --noconfirm yu-medija-player.spec

      - name: Build AppImage
        run: ./scripts/build_appimage.sh

      - name: Build .deb
        run: ./scripts/build_deb.sh

      - name: Checksums
        run: |
          cd dist
          sha256sum yu-medija-player-*.AppImage > "yu-medija-player-${VERSION}-x86_64.AppImage.sha256"
          sha256sum yu-medija-player_*.deb > "yu-medija-player_${VERSION}_amd64.deb.sha256"
          ls -lh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Yu Medija Player ${{ github.ref_name }}
          draft: false
          fail_on_unmatched_files: true
          body: |
            Lightweight cross-platform video player: a Python/PyQt6 interface with **libmpv** playback.

            ### Download (Linux)

            | Package | For | Install |
            | --- | --- | --- |
            | `yu-medija-player-*-x86_64.AppImage` | any distribution | `chmod +x`, then run it |
            | `yu-medija-player_*_amd64.deb` | Debian / Ubuntu / Mint | `sudo apt install ./yu-medija-player_*_amd64.deb` |
            | `*.sha256` | checksums | `sha256sum -c file.sha256` |

            ```bash
            chmod +x yu-medija-player-*-x86_64.AppImage
            ./yu-medija-player-*-x86_64.AppImage movie.mkv
            ```

            ### Features

            - Most formats through libmpv: MP4, MKV, AVI, WebM, MOV, TS, M2TS, WMV, FLV…
            - M3U/M3U8 playlists with groups, hidden groups and relative paths
            - Subtitles: several external SRT files, embedded tracks with real language names, ±100 ms delay, OpenSubtitles search
            - Playback speed 0.25×–4× (`[` / `]` to step, `R` to reset)
            - Screenshot of the current frame (`P`), five themes, welcome screen with recent files, drag and drop
            - Stream URLs (IPTV/HLS) with Referer and User-Agent support

            ### Notes

            - A system **libmpv** is required (Arch/CachyOS: `pacman -S mpv`; Debian/Ubuntu: `libmpv2`, which the `.deb` pulls in). Without it the app falls back to Qt Multimedia with fewer formats.
            - On Wayland the app runs through XWayland because libmpv is embedded through an X11 `wid`; `QT_QPA_PLATFORM=wayland` forces native mode.
            - Packages are built in GitHub Actions on Ubuntu 24.04.
          files: |
            dist/yu-medija-player-*.AppImage
            dist/yu-medija-player_*.deb
            dist/*.sha256
